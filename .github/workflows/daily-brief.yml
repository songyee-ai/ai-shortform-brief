name: daily-brief

on:
  schedule:
    # UTC 18:47 = 한국 시간 03:47. GitHub 예약은 실제로 3~5시간 늦게 돌아서(10-30~11-09: 2시간 52분~5시간 9분)
    # 07:30 예약이 낮 12시 무렵에 왔다 → 미리 걸어 아침에 오게 한다. 붐비는 정각·30분은 피한다
    - cron: "47 18 * * *"
  workflow_dispatch:          # Actions 화면에서 직접 실행

permissions:
  contents: write             # 보낸 목록·실행 기록을 저장소에 다시 커밋한다

concurrency:
  group: daily-brief          # 두 번 겹쳐 돌면 같은 소식을 두 번 보낼 수 있어 하나씩만
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 실행·전송
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 있으면 Gemini 무료 등급, 없으면 OpenAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash                 # pipefail이 켜져 있어 tee를 거쳐도 실패가 실패로 남는다
        run: python -B run.py --send 2>&1 | tee run.log   # 실패 알림에 마지막 오류 줄을 넣으려고 남긴다

      # 전송이 실패해도 실행 기록은 남긴다. 보낸 목록이 저장소에 있어야 다음 날 같은 소식을 다시 보내지 않는다
      - name: 기록 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/metrics.jsonl store/sent.jsonl store/preview-latest.txt store/selection
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -m "브리핑 실행 기록 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push

      # 실패해도 알림이 없어 11-04~11-09 엿새 동안 브리핑이 멈춘 걸 몰랐다 → 어느 단계에서 실패하든 Telegram으로 알린다
      - name: 실패 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason=$(grep -E "Error|error|실패" run.log 2>/dev/null | tail -1 | cut -c1-300)
          [ -n "$reason" ] || reason="브리핑 단계 전에 멈췄거나 오류 줄이 없습니다"
          text="⚠️ $(TZ=Asia/Seoul date +%-m/%-d) 브리핑 실패
          ${reason}
          로그: ${RUN_URL}"
          curl -sS -o /dev/null -w "Telegram 응답 %{http_code}\n" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}"
