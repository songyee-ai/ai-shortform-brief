name: daily-brief

on:
  schedule:
    - cron: "30 22 * * *"   # UTC 22:30 = 한국 시간 07:30 (GitHub 예약은 몇 분~수십 분 늦을 수 있다)
  workflow_dispatch:          # Actions 화면에서 직접 실행

permissions:
  contents: write             # 보낸 목록·실행 기록을 저장소에 다시 커밋한다

concurrency:
  group: daily-brief          # 두 번 겹쳐 돌면 같은 소식을 두 번 보낼 수 있어 하나씩만
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 실행·전송
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -B run.py --send

      # 전송이 실패해도 실행 기록은 남긴다. 보낸 목록이 저장소에 있어야 다음 날 같은 소식을 다시 보내지 않는다
      - name: 기록 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/metrics.jsonl store/sent.jsonl store/preview-latest.txt store/selection
          if git diff --cached --quiet; then echo "바뀐 기록 없음"; exit 0; fi
          git commit -m "브리핑 실행 기록 $(TZ=Asia/Seoul date +%F)"
          git pull --rebase
          git push
