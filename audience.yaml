# 독자 · 중요도 기준 · 제외 조건. 선별 노드가 이 파일을 읽어 LLM 지시문을 만든다.
# 코드를 고치지 않고 이 파일만 바꿔 다른 독자에게 쓸 수 있게 분리했다.

reader: >
  AI 숏폼 영상을 이제 막 시작했거나 꾸준히 올리고 있는 한국의 개인 창작자.
  무료이거나 저렴한 도구를 반기고, 매일 아침 요즘 뜨는 형식과 바로 써먹을 좋은 소식을 먼저 확인하고 싶어 한다.

# 기사 칸(제작 도구 소식)에서 중요하게 보는 것 — 위에 있을수록 우선
important:
  - 오늘 바로 써 볼 수 있는 새 영상·이미지 생성 도구나 모델, 기능 추가
  - 가격·요금제·크레딧·무료 사용량의 실제 변화 (무료·저렴해지는 소식 우선)
  - 결과물을 더 잘 만드는 제작 기법·프롬프트 요령
  - AI 콘텐츠 표시 의무, 수익화 정책, 저작권·초상권 같은 플랫폼 정책 변화

# 기사 칸에서 고르지 않는 것
exclude:
  - 경쟁 제품 비교나 "최고의 도구 N가지" 같은 순위·홍보 글
  - 연구 논문, 벤치마크 점수, 성능 지수 발표

# 버리지는 않지만 우선순위를 낮게 두는 것
low_priority:
  - 투자·실적·인수 같은 회사 소식
  - 영상·이미지 제작과 직접 관계없는 AI 소식 (법률·코딩·보안 등)

# 영상 칸(요즘 뜨는 AI 숏폼)
video:
  # 갈래별로 남길 'AI로 만들었나' 판정. 여기 없는 조합(뉴스·해설, 기타, AI 무관 작품 등)은 고르지 않는다
  keep:
    작품: [AI로 만듦]                  # AI로 직접 만든 드라마·뮤비
    밈: [AI로 만듦]                    # AI로 직접 만든 따라 하기·패러디
    정보 전달: [AI로 만듦, AI를 다룸]   # AI 제작 방법·도구 사용법·제작기
  # 자리마다 고를 갈래. 각 자리는 해당 갈래 중 조회수 1위. 해당 갈래가 없는 날은 남은 영상 중 조회수 순으로 채운다
  # from: 도구 검색어 를 주면 도구 이름 검색어로 찾은 영상에서만 고른다 (AI 해설 영상이 정보 전달 자리를 가져가지 않게)
  # 그 갈래가 없는 날의 빈자리도 어느 한 자리의 조건에 맞는 영상으로만 채운다
  slots:
    - {genres: [작품, 밈]}                        # 요즘 뜨는 AI 영상
    - {genres: [정보 전달], from: 도구 검색어}     # 따라 해 볼 사용법·제작기
  one_per_channel: true    # 같은 채널은 하루 1건 (코드가 막는다)

# 요약의 why(인사이트) 칸에 쓸 것. 헤드라인·요약은 원문만 따르고 독자 관점은 이 칸에만 쓴다
insight: >
  독자가 오늘 바로 해 볼 행동 한 가지를 한 문장으로 쓴다(예: "무료 체험으로 사진 한 장을 만화 스타일로 바꿔 보세요").
  바로 해 볼 것이 없는 소식이면 "지켜볼 점:"으로 시작해 한 문장으로 쓴다. 요약을 되풀이하지 않는다.

publish:
  tools: 3      # 기사 칸 발행 건수
  trend: 2      # 영상 칸 발행 건수
